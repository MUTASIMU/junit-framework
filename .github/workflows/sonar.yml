name: SonarCloud Scan
on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter the JUnit Tag (e.g., r5.0.0)'
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tags from upstream repository
        run: git fetch --tags --force https://github.com/junit-team/junit-framework.git
      
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-framework
            -Dsonar.organization=mutasimu
            -Dsonar.branch.name=${{ github.event.inputs.tag }}
            -Dsonar.sources=. 
