name: SonarCloud Analysis
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important for SonarCloud to see full history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      # JUnit 5 uses Gradle. This command builds the project, runs tests, and generates the JaCoCo report.
      - name: Build and test with Gradle
        run: ./gradlew build jacocoTestReport

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
name: JUnit Empirical Study

on:
  workflow_dispatch: # Allows you to trigger the 10 scans manually

jobs:
  scan-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keeps running even if one old version fails to build
      matrix:
        # These 10 versions span from 2017 to 2023 (well over 3 years)
        tag: ["r5.0.0", "r5.1.0", "r5.2.0", "r5.3.0", "r5.4.0", "r5.5.0", "r5.6.0", "r5.7.0", "r5.8.0", "r5.9.0"]

    steps:
      - name: Checkout Code for ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0 

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11 # JDK 11 is safest for older JUnit 5 versions
          distribution: 'temurin'

      - name: Compile Production Code Only
        # We skip tests to save time and avoid test-related errors
        run: ./gradlew assemble -x test

      - name: SonarCloud Scan for ${{ matrix.tag }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-${{ matrix.tag }}
            -Dsonar.organization=mutasimu
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/build/classes/java/main
            -Dsonar.exclusions=**/src/test/**,**/build/**,**/src/integrationTest/**
