name: SonarCloud Scan

on: 
  push:
    branches:
      - main # Automatically analyzes your default branch on every push
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter JUnit Tag (e.g., r5.0.0). Leave blank for default branch.'
        required: false

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 1. Point to the official repository so tags are found
          repository: junit-team/junit-framework
          # 2. Use the tag if provided, otherwise use the default branch (main)
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'

      # 3. REQUIRED: Compile the Java code before scanning
      - name: Build with Gradle
        run: ./gradlew assemble -x test --no-daemon

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-fork
            -Dsonar.organization=mutasimu
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/build/classes/java/main
            -Dsonar.exclusions=**/src/test/**,**/build/**
