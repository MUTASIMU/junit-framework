name: JUnit Empirical Study

on:
  workflow_dispatch: 

jobs:
  scan-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        # Releases from r5.7.0 to r5.10.0 span ~3 years and are compatible with JDK 11
        tag: ["r5.7.0", "r5.7.1", "r5.7.2", "r5.8.0", "r5.8.1", "r5.8.2", "r5.9.0", "r5.9.1", "r5.9.2", "r5.10.0"]

    steps:
      - name: Checkout Code for ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          repository: junit-team/junit-framework
          ref: ${{ matrix.tag }}
          fetch-depth: 0 

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'

      # The official build command for these versions is clean assemble
      - name: Compile Production Code Only
        run: ./gradlew clean assemble

      - name: SonarCloud Scan for ${{ matrix.tag }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-${{ matrix.tag }}
            -Dsonar.organization=mutasimu
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/build/classes/java/main
            -Dsonar.exclusions=**/src/test/**,**/build/**,**/src/integrationTest/**
