name: SonarCloud Scan
on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter the JUnit Tag (e.g., r5.0.0)'
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/junit-team/junit5.git
          git fetch upstream --tags --force

      - name: Checkout specific tag
        run: git checkout tags/${{ github.event.inputs.tag }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-framework
            -Dsonar.organization=mutasimu
            -Dsonar.branch.name=${{ github.event.inputs.tag }}
            -Dsonar.sources=.
            -Dsonar.java.binaries=.
            -Dsonar.exclusions=**/build/**,**/target/**,**/src/test/**
