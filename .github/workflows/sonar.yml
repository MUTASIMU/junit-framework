name: SonarCloud Scan
on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter JUnit Tag (e.g., r5.0.0)'
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: junit-team/junit5
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-${{ github.event.inputs.tag }}
            -Dsonar.organization=mutasimu
            -Dsonar.sources=.
            -Dsonar.java.binaries=.
            -Dsonar.exclusions=**/src/test/**,**/build/**
