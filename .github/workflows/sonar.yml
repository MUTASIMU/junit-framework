name: JUnit Empirical Study

on:
  workflow_dispatch: 

jobs:
  scan-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        tag: ["r5.0.0", "r5.1.0", "r5.2.0", "r5.3.0", "r5.4.0", "r5.5.0", "r5.6.0", "r5.7.0", "r5.8.0", "r5.9.0"]

    steps:
      - name: Checkout Code for ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          repository: junit-team/junit-framework
          ref: ${{ matrix.tag }}
          fetch-depth: 0 

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'

      # Upgrade the old Gradle wrapper so it can run on modern CI environments
      - name: Upgrade Gradle Wrapper
        run: ./gradlew wrapper --gradle-version 7.6.1

      - name: Compile Production Code Only
        run: ./gradlew assemble -x test

      - name: SonarCloud Scan for ${{ matrix.tag }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=MUTASIMU_junit-${{ matrix.tag }}
            -Dsonar.organization=mutasimu
            -Dsonar.sources=.
            -Dsonar.java.binaries=**/build/classes/java/main
            -Dsonar.exclusions=**/src/test/**,**/build/**,**/src/integrationTest/**
